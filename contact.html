<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact Us</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body {
      background: #0f1a2b;
      color: #fff;
      font-family: 'Segoe UI', sans-serif;
    }

    /* Contact Section */
    .contact-section {
      max-width: 1000px;
      margin: auto;
      padding: 80px 20px;
    }

    .contact-section h1 {
      font-size: 2.5rem;
      margin-bottom: 10px;
      color: #fff;
    }
    .contact-section h1 span {
      color: #a4ff9f;
    }
    .breadcrumb {
      font-size: 0.9rem;
      color: #bbb;
      margin-bottom: 30px;
    }

    /* Banner */
    .contact-banner {
      background: linear-gradient(90deg, #a4ff9f, #e6ff74);
      padding: 12px;
      font-weight: bold;
      color: #000;
      margin-bottom: 40px;
      white-space: nowrap;
      animation: marquee 25s linear infinite;
    }

    /* Info Section */
    .contact-info {
      margin-bottom: 40px;
    }
    .contact-item {
      display: flex;
      align-items: flex-start;
      margin-bottom: 20px;
    }
    .contact-item i {
      font-size: 1.5rem;
      margin-right: 15px;
      color: #a4ff9f;
    }
    .contact-item p {
      margin: 0;
      color: #ddd;
    }
    .contact-item strong {
      display: block;
      color: #fff;
      margin-bottom: 5px;
    }

    /* Contact Form */
    .contact-form {
      background: rgba(255,255,255,0.05);
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 0 20px rgba(164,255,159,0.1);
    }
    .contact-form p {
      margin-bottom: 20px;
      color: #ccc;
    }
    .form-row {
      display: flex;
      gap: 20px;
      margin-bottom: 20px;
    }
    .form-row input {
      flex: 1;
    }
    .contact-form input,
    .contact-form textarea {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: #1b2a3d;
      color: #fff;
      outline: none;
    }
    .contact-form textarea {
      min-height: 120px;
      resize: vertical;
    }
    .contact-form input::placeholder,
    .contact-form textarea::placeholder {
      color: #888;
    }

    .btn-submit {
      display: inline-block;
      padding: 12px 20px;
      border: none;
      border-radius: 30px;
      font-weight: bold;
      background: linear-gradient(90deg, #a4ff9f, #e6ff74);
      color: #000;
      cursor: pointer;
      transition: transform 0.3s;
      margin-top: 10px;
    }
    .btn-submit:hover {
      transform: scale(1.05);
    }

    /* Animations */
    @keyframes marquee {
      0% { transform: translateX(0); }
      100% { transform: translateX(-100%); }
    }

    /* Responsive */
    @media (max-width: 768px) {
      .form-row {
        flex-direction: column;
        gap: 15px;
      }
      .contact-section h1 { font-size: 2rem; }
    }
  </style>
  
  
</head>
<body>
  <section class="contact-section">
    <!-- Heading -->
    <h1>Contact <span>us</span></h1>
    <p class="breadcrumb">Home / Contact Us</p>

    

    <!-- Info -->
    <div class="contact-info">
      <div class="contact-item">
        <i class="fas fa-phone"></i>
        <p>
          <strong>Phone Number</strong>
          +1 (123) 456-789
        </p>
      </div>
      <div class="contact-item">
        <i class="fas fa-envelope"></i>
        <p>
          <strong>E-Mail</strong>
          info@domain.com
        </p>
      </div>
      <div class="contact-item">
        <i class="fas fa-map-marker-alt"></i>
        <p>
          <strong>Address</strong>
          2972 Westheimer Rd. Santa Ana, New York, USA
        </p>
      </div>
    </div>

    <!-- Contact Form -->
    <form class="contact-form">
      <p>Fill out the form below to connect with me. I'll get back to you soon to discuss your project or answer any questions.</p>
      
      <div class="form-row">
        <input type="text" placeholder="First Name" required>
        <input type="text" placeholder="Last Name" required>
      </div>
      <div class="form-row">
        <input type="email" placeholder="Email" required>
        <input type="text" placeholder="Phone Number" required>
      </div>
      <textarea placeholder="Message" required></textarea>

      <br>
      <button type="submit" class="btn-submit">Submit Message</button>
    </form>
  </section>
</body>
</html>
